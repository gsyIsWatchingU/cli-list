name: Windows 构建

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建并验证
        shell: pwsh
        run: .\test.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cli-list-windows
          path: |
            CLIList.exe
            cli-list.ico
            cli-list.svg
            commands.json
            install.ps1
            uninstall.ps1
            cli-list.cmd
